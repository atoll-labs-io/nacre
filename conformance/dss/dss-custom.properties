# Overrides of dss.properties for Nacre's conformance bench.
# Anchors come from a PKCS#12 keystore mounted at run time; no check is disabled.
trusted.source.keystore.type = PKCS12
trusted.source.keystore.filename = nacre-anchors.p12
trusted.source.keystore.password = nacre-anchors
# The bench trusts its own root only; skip downloading the EU trusted lists.
cron.tl.loader.enable = false
