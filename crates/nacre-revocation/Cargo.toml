[package]
name = "nacre-revocation"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Certificate revocation for Nacre: reading, verifying and judging X.509 CRLs and OCSP responses, and fetching them over HTTP."

[lints]
workspace = true

[dependencies]
nacre-core = { path = "../nacre-core", version = "0.1.0" }
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
spki = "0.8"
x509-cert = "0.3"
sha2 = "0.11"
# SHA-1 only identifies the certificate in an OCSP `CertID` (RFC 5019 §2.1.1), never signs.
sha1 = "0.11"
getrandom = "0.4"
p256 = { version = "0.14", features = ["ecdsa"] }
# Pinned: a release candidate, and no lock file is committed.
rsa = "=0.10.0-rc.19"
thiserror = "2"
# Plain HTTP only: CRLs are signed, and a caller needing more injects its own source.
# `~3.5`: the address check plugs into `ureq::unversioned`, which may break in a minor release.
ureq = { version = "~3.5", default-features = false, optional = true }

[features]
default = []
http = ["dep:ureq"]

[dev-dependencies]
nacre-core = { path = "../nacre-core", features = ["test-signer"] }
nacre-conformance = { path = "../nacre-conformance" }
x509-cert = { version = "0.3", features = ["builder"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
der = { version = "0.8", features = ["alloc", "derive", "oid", "pem"] }
# Turns `http` on for the tests, so `cargo test --workspace` runs them without a feature flag.
nacre-revocation = { path = ".", features = ["http"] }

# A name of its own: `forge_attacks` is already nacre-cms's example, and two examples of one
# name overwrite each other's binary in the shared target directory.
[[example]]
name = "forge_crl_attacks"
path = "examples/forge_attacks.rs"

[[example]]
name = "forge_ocsp_attacks"
path = "examples/forge_ocsp_attacks.rs"
