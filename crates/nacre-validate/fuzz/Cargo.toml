[package]
name = "nacre-validate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.97"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nacre-validate = { path = ".." }

# Its own workspace: the root manifest is frozen and must not list this crate.
[workspace]
members = ["."]

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false
